<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15233f">
<title>JUMP JAM! · 점프 잼!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/noto/noto.css">
<link rel="stylesheet" href="fonts/jua.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="paper-ui.css">
</head>
<body>
<section id="home" aria-label="점프 잼! 첫 화면">
  <div class="title-art">
    <img src="ui/title.webp" alt="JUMP JAM!" draggable="false">
    <a class="menu-hit menu-join" id="openJoin" href="#join">게임 입장</a>
    <button class="menu-hit menu-how" id="openHow" type="button">게임 방법</button>
    <a class="menu-hit menu-teacher" href="/teacher">선생님 모드</a>
  </div>
  <dialog class="card how-card" id="how">
    <h1>게임 방법</h1>
    <ol>
      <li>반과 번호를 고르고 동물 캐릭터로 입장해요.</li>
      <li>영어 퀴즈를 풀고, 받은 발판이나 함정을 코스에 놓아요.</li>
      <li>방향 버튼과 점프 버튼으로 깃발까지 달려요. 키보드는 ← →와 스페이스바를 써요.</li>
    </ol>
    <form method="dialog"><button class="btn green">확인</button></form>
  </dialog>
</section>

<!-- 입장 -->
<section id="join" class="screen hide">
  <button class="art-btn back" id="backHome" type="button">뒤로</button>
  <img class="join-logo" src="ui/logo-sky.webp" alt="JUMP JAM!">
  <h1 class="join-banner">게임 입장</h1>
  <div class="joinGrid">
    <div class="card join-form">
      <div class="field"><label for="code">입장 코드</label><input id="code" class="code-input" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="예: JAM428"></div>
      <div class="field"><label for="num">번호</label><input id="num" type="number" inputmode="numeric" min="1" max="40" placeholder="예: 7"></div>
      <div class="field"><label for="name">이름</label><input id="name" maxlength="8" placeholder="이름"></div>
      <div class="field"><label for="nick">별명 <span>(선택 · 5글자까지)</span></label><input id="nick" maxlength="5" placeholder="예: 보리"></div>
      <button class="art-btn enter" id="go" type="button">입장하기</button>
      <div class="err" id="err"></div>
    </div>
    <div class="card join-animals">
      <h2><i></i>동물 캐릭터 선택<i></i></h2>
      <div class="animals" id="animals"></div>
      <p class="join-tip"><i></i>친구가 고른 동물은 선택할 수 없어요<i></i></p>
    </div>
  </div>
</section>

<!-- 게임 -->
<section id="stage" class="hide">
  <div class="hud">
    <img class="hud-logo" src="ui/logo.webp" alt="JUMP JAM!">
    <span class="pill" id="hRound">대기 중</span>
    <span id="hMap"></span>
    <span class="grow"></span>
    <span class="pill" id="hScore">⭐ 0점</span>
    <span class="time" id="hTime">--</span>
    <button class="pill" id="snd" title="소리">🔊</button>
    <button class="pill" id="fs" title="전체 화면">⛶</button>
  </div>
  <div class="canvasWrap" id="wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="ov"></div>
  </div>
  <div class="controls hide" id="ctrl">
      <div class="pad"><button id="bL" aria-label="왼쪽 이동">◀</button><button id="bR" aria-label="오른쪽 이동">▶</button></div>
      <div class="pad"><button class="jump" id="bJ">점프</button></div>
  </div>
  <div class="placeBar hide" id="placeBar">
    <div class="offer" id="offer"></div>
    <div class="placeBtns">
      <button class="btn ghost" id="rotBtn">↻ 회전</button>
      <button class="btn orange" id="okBtn">설치 확정</button>
    </div>
  </div>
</section>
<div class="pauseVeil hide" id="pause">⏸ 잠시 멈춤<small>선생님이 다시 시작할 때까지 기다려요</small></div>

<script src="/socket.io/socket.io.js"></script>
<script src="shared.js"></script>
<script src="animal-sheets.js"></script>
<script src="render.js"></script>
<script src="sound.js"></script>
<script src="student.js"></script>
</body>
</html>
