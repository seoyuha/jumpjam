<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUMP JAM! · 선생님</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/noto/noto.css">
<link rel="stylesheet" href="fonts/jua.css">
<link rel="stylesheet" href="style.css">
<style>
body{background:var(--navy)}
#login,#setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card,#setup .card{width:min(520px,94vw)}
#dash{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 340px}
#dash.wide{grid-template-columns:1fr 0}
#dash.wide .side{display:none}
.top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;font-weight:900}
.top .meta{color:#c8d2ea;font-weight:700}
.top .grow{flex:1}
.top .time{font-variant-numeric:tabular-nums;background:#fff;color:var(--navy);border-radius:10px;padding:4px 14px;font-size:20px;font-weight:900}
.top .btn{padding:8px 14px;font-size:15px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 8px 8px 16px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:7px 12px;font-weight:800;font-size:15px}
.tabs button.on{background:#fff;color:var(--navy)}
.tabs button b{display:inline-block;margin-left:6px;background:var(--purple);color:#fff;border-radius:8px;padding:0 6px;font-size:13px}
.tabs button.on b{background:var(--green)}
.tv{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.tv canvas{border-radius:14px;display:block}
.live{position:absolute;left:14px;top:12px;background:#e5484d;color:#fff;font-weight:900;border-radius:8px;padding:3px 10px;font-size:15px}
.feedBox{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.feedBox div{background:rgba(21,35,63,.85);color:#fff;border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px;animation:pop .3s}
.side{background:#fff;display:flex;flex-direction:column;min-height:0;border-top-left-radius:18px}
.sideTabs{display:flex;border-bottom:1px solid var(--line)}
.sideTabs button{flex:1;padding:12px 0;background:none;font-weight:800;color:var(--sub)}
.sideTabs button.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--purple)}
.sideBody{flex:1;overflow:auto;padding:10px}
.stu{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:10px;font-weight:700;font-size:14px}
.stu:nth-child(odd){background:var(--bg)}
.stu canvas{width:30px;height:30px}
.stu .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .sl{background:var(--navy);color:#fff;border-radius:6px;padding:0 6px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb;flex:none}.dot.on{background:#22c55e}
.x{background:none;color:#aab;font-size:16px;padding:0 4px}
.set h3{margin:14px 0 6px;font-size:15px}
.set select,.set input[type=file]{width:100%;padding:8px;border-radius:10px;border:2px solid var(--line);font-weight:700}
.set .btn{width:100%;margin-top:6px;font-size:15px;padding:9px}
.lobbyBox{display:flex;gap:22px;align-items:center;background:#fff;border-radius:22px;padding:22px 26px;max-width:92%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.lobbyBox img{width:220px;height:220px}
.joined{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:240px;overflow:auto}
.big{font-size:30px;font-weight:900;margin:2px 0}
.url{font-size:22px;font-weight:900;color:var(--purple);word-break:break-all}
.sumGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px}
.sumGrid>div{background:var(--bg);border-radius:12px;padding:8px 10px;font-weight:700}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:10px 0}
.podium div{display:flex;flex-direction:column;align-items:center;font-weight:900}
.podium .bar{width:110px;border-radius:12px 12px 0 0;color:#fff;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:28px}
</style>
<link rel="stylesheet" href="paper-ui.css">
</head>
<body class="teacher">
<section id="login"><div class="card">
  <a class="pill" href="/">← 첫 화면</a>
  <img class="join-logo" src="ui/logo-sky.webp" alt="JUMP JAM!" style="margin:8px auto 4px">
  <h2 style="margin:4px 0 12px;font-size:28px;font-weight:900;text-align:center">선생님 관리</h2>
  <div class="field"><label>교사 비밀번호</label><input id="pw" type="password" placeholder="비밀번호"></div>
  <button class="btn" id="loginBtn" style="width:100%">들어가기</button><div class="err" id="lerr"></div>
</div></section>

<section id="setup" class="hide">
  <header class="tbar"><img class="hud-logo" src="ui/logo.webp" alt="JUMP JAM!"><i class="tsep"></i><b>🎓 선생님 관리</b></header>
  <div class="setup-frame">
    <div class="card setup-card">
      <h2><i></i>수업 열기<i></i></h2>
      <div class="srow"><label>👥 우리 반</label><div class="seg" id="sCls"></div></div>
      <div class="srow"><label>📖 문제 단원</label><div class="seg" id="sUnit"></div></div>
      <div class="srow"><label>🗺️ 맵 세트</label><div class="seg" id="sSet"></div></div>
      <div class="srow code"><label>💻 학생 입장 코드</label><input id="sCode" class="code-input" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false"><button id="newCode" class="art-btn newcode" type="button">새 코드</button></div>
      <p class="setup-tip"><i></i>학생에게 이 코드를 알려 주세요<i></i></p>
      <div class="err" id="serr"></div>
    </div>
    <div class="card setup-side"><span class="gold-pill">캐릭터 중복 없이 선택</span><canvas id="setupArt" width="420" height="400"></canvas></div>
  </div>
  <button id="openBtn" class="art-btn open" type="button">대기실 열기</button>
</section>

<section id="dash" class="hide">
  <div class="top">
    <h1><img class="hud-logo" src="ui/logo.webp" alt="JUMP JAM!"></h1><i class="tsep"></i><b class="tname">🎓 선생님 관리</b>
    <span class="pill round-pill" id="phase">대기실</span><span class="meta" id="meta"></span>
    <span class="grow"></span>
    <span class="pill code-pill" id="codePill"></span>
    <span class="time" id="time">--</span>
    <button class="pill" id="sideBtn" title="옆 칸 숨기기">☰</button>
    <button class="pill" id="fsBtn" title="전체 화면">⛶</button>
  </div>
  <div class="main">
    <div class="tv" id="tv"><canvas id="cv"></canvas><span class="live hide" id="live"><b>((●))</b> 실시간 관전 <em>LIVE</em></span><div class="feedBox" id="feed"></div><div class="overlay" id="tov"></div></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="side">
    <div class="sideTabs"><button class="on" data-t="stu">👥 학생</button><button data-t="rank">🏆 순위</button><button data-t="set">⚙️ 설정</button></div>
    <div class="sideBody" id="sideBody"></div>
  </div>
  <div class="teacher-actions">
    <button class="btn green" id="startBtn">게임 시작</button>
    <button class="btn ghost" id="pauseBtn">⏸ 일시정지</button>
    <button class="btn ghost" id="skipBtn">다음 단계 ⏭</button>
    <button class="btn red" id="endBtn">⏻ 게임 끝내기</button>
  </div>
</section>
<div class="pauseVeil hide" id="pause" style="pointer-events:none;background:rgba(21,35,63,.45)">⏸ 잠시 멈춤</div>

<script src="/socket.io/socket.io.js"></script>
<script src="shared.js"></script>
<script src="animal-sheets.js"></script>
<script src="render.js"></script>
<script src="teacher.js"></script>
</body>
</html>
